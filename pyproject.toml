[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "garmin-owl"
version = "0.2.1"
description = "Local-only, read-only MCP server for Garmin Connect"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "garmin-owl contributors" }]
dependencies = [
  "garminconnect>=0.3.11,<0.4",
  "mcp>=2.0,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
garmin-owl = "garmin_owl.server:main"
garmin-owl-auth = "garmin_owl.auth:main"
garmin-owl-sync = "garmin_owl.sync:main"
garmin-owl-cache-info = "garmin_owl.cache_cli:info_main"
garmin-owl-cache-clear = "garmin_owl.cache_cli:clear_main"
garmin-owl-smoke = "garmin_owl.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_owl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["garmin_owl"]

[[tool.mypy.overrides]]
module = ["garminconnect", "garminconnect.*"]
ignore_missing_imports = true
